# Prometheus scrapes SOC-side components only. Sensor health arrives outward on the link and is exposed by
# the receiver; nothing scrapes across the simulated boundary.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["redpanda:9644"]}]
  - job_name: flink
    static_configs: [{targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"]}]
  - job_name: receiver
    static_configs: [{targets: ["receiver:9101"]}]
  - job_name: consumers
    static_configs:
      - targets: ["raw-clickhouse:9102", "features-clickhouse:9102", "alerts-clickhouse:9102",
                  "aux-clickhouse:9102", "alerts-notifier:9102", "archive-exporter:9102"]
  - job_name: consumers-search
    static_configs: [{targets: ["alerts-opensearch:9102"]}]
  - job_name: api
    static_configs: [{targets: ["api:9105"]}]
  - job_name: job-supervisor
    static_configs: [{targets: ["job-supervisor:9106"]}]
  - job_name: clickhouse
    static_configs: [{targets: ["clickhouse:9363"]}]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{targets: ["minio:9000"]}]
